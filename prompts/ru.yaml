# Russian language pack. See prompts/en.yaml for what every key does — the
# comments there are the reference, this file only carries the strings.

meta:
  name: Russian

  unknown_speaker: неизвестно

  generic_speakers:
    - я
    - мы
    - ты
    - вы
    - он
    - она
    - они
    - оно
    - все
    - кто-то
    - некто
    - мужчина
    - женщина
    - девушка
    - парень
    - незнакомец
    - незнакомка
    - голос
    - толпа
    - народ
    - рассказчик
    - автор
    - наблюдатель
    - первый
    - второй
    - гость
    - хозяин
    - оба

  # Russian is heavily inflected: a tense or person change rewrites the ending,
  # so exact word matching would flag an honest edit as a rewrite. Five
  # characters is short enough to survive inflection and long enough that a
  # different word rarely collides.
  stem_length: 5

  refusal_markers:
    - я не могу
    - не могу помочь
    - не могу выполнить
    - не могу продолжить
    - я не буду
    - я не стану
    - отказываюсь
    - не имею права
    - противоречит моим
    - нарушает правила
    - нарушает политику
    - политикой контента
    - как ии
    - как языковая модель

  # Words that begin a chapter heading in this language. A line that starts
  # with one of these and is short enough is treated as a heading and becomes a
  # free scene boundary. Bare numbers and Roman numerals are recognised for
  # every language and do not need listing.
  # One or two lines describing what these prompts are tuned for. The menu
  # shows it, so that anyone opening the launcher sees what register the
  # dataset will come out in. Rewrite it whenever you rewrite the prompts —
  # keeping it here means the description cannot drift away from the thing
  # it describes.
  style_note: |
    Промпты из коробки нацелены на серьёзный ролеплей с упором на персонажа:
    внутреннее рассуждение перед действием, настоящий конфликт, выбор,
    который чего-то стоит. Под конкретный сеттинг или регистр не заточены.

  chapter_words:
    - глава
    - часть
    - пролог
    - эпилог
    - интерлюдия
    - книга
    - раздел

  fallback_user: собеседник
  fallback_char: персонаж

cards:
  full: >-
    Ты — [[char]] и одновременно рассказчик сцены. Отыгрывай [[char]], сохраняя
    голос и атмосферу первоисточника; веди повествование, окружение и
    второстепенных персонажей, но никогда не действуй и не говори за
    собеседника. Перед поступком или ответом [[char]] взвешивает происходящее —
    покажи ход его мысли и цену выбора. Действия и мир — третьим лицом,
    реплики — прямой речью.

  core: >-
    Ты — [[char]] и одновременно рассказчик сцены. Отыгрывай [[char]], сохраняя
    голос и атмосферу первоисточника; веди повествование, окружение и
    второстепенных персонажей, но никогда не действуй и не говори за
    собеседника.

segment:
  system: |-
    Ты размечаешь границы сцен в художественном тексте. Граница ставится ТОЛЬКО
    при явной смене локации, времени действия или состава персонажей.
    Размышления рассказчика, отступления и продолжение диалога — НЕ новая сцена,
    они принадлежат текущей. Если абзац начинается со связки (Однако, Но,
    Впрочем, Именно, При этом) или ссылается на предыдущий — границы перед ним
    НЕТ. Сомневаешься — не ставь: отсутствие границ во фрагменте это нормальный
    и частый ответ. Отвечай только валидным JSON.

  user: |-
    Ниже пронумерованные абзацы. Верни JSON вида {"boundaries": [числа]} —
    номера абзацев, ПЕРЕД которыми начинается новая сцена. Если весь фрагмент —
    одна сцена, верни {"boundaries": []}. Никакого текста кроме JSON.

    [[paragraphs]]

  strict_suffix: |-

    ВАЖНО: ответ — ТОЛЬКО {"boundaries": [числа]}, никакого текста, не более 60 токенов.

attribute:
  system: >-
    Ты аккуратный литературный аналитик. Работаешь ТОЛЬКО с данным текстом,
    ничего не домысливаешь. Отвечаешь строго валидным JSON без пояснений.

  user: |-
    Сцена:
    ---
    [[scene]]
    ---
    Верни JSON:
    {
      "characters": ["имена всех персонажей, присутствующих в сцене"],
      "lines": [{"speaker": "имя или 'неизвестно'", "quote": "первые 6-8 слов реплики"}]
    }
    В lines — каждая реплика прямой речи по порядку. Если говорящий не
    определяется однозначно из текста — пиши 'неизвестно', не гадай.

convert:
  system: >-
    Ты конвертируешь сцены прозы в формат ролевого транскрипта. Главное правило:
    авторскую наррацию НЕ пересказывать своими словами, а переносить почти
    дословно, меняя только то, что требует формат — связки, местоимения. Голос и
    атмосфера первоисточника должны сохраниться полностью. Отвечай строго
    валидным JSON.

  user: |-
    Сцена:
    ---
    [[scene]]
    ---
    Отыгрываемый персонаж (char): [[char]]
    Собеседник (user): [[user]]
    Атрибуция реплик — используй её, не переатрибутируй: [[attribution]]

    Собери транскрипт:
    1. Ходы char — его реплики плюс вся наррация вокруг них: действия,
       обстановка, внутреннее состояние, перенесённые из текста почти дословно.
       Реплики прочих персонажей, тех, кто не user, вплетай в ходы char как
       часть наррации.
    2. Ходы user — только его реплики, голые, без наррации.
    3. Порядок событий сохраняется. Ничего не добавляй от себя.

    JSON: {"turns": [{"role": "char"|"user", "text": "..."}]}

validate:
  system: Ты строгий редактор. Отвечаешь только валидным JSON.

  user: |-
    Исходная сцена:
    ---
    [[scene]]
    ---
    Транскрипт, собранный из неё:
    ---
    [[transcript]]
    ---
    Проверь и верни JSON:
    {"voice_preserved": true/false,   сохранён ли авторский голос наррации
     "no_invention": true/false,      нет ли событий или деталей, которых нет в сцене
     "split_correct": true/false,     верно ли реплики разнесены по персонажам
     "comment": "одно предложение"}

synth:
  system: >-
    Ты пишешь ролевые сессии. Данные тебе фрагменты — это ОБРАЗЕЦ МЫШЛЕНИЯ
    персонажей, а не образец текста. Пиши своим языком, но персонаж должен
    решать, чувствовать и рассуждать так, как во фрагментах: те же веса, та же
    логика, та же структура конфликта. В каждом ходе персонажа перед действием
    или репликой — слой внутреннего рассуждения: что он замечает, какие два
    несовместимых желания или принципа сталкиваются, чем он платит за выбор.
    Развилка должна быть настоящей: исход не предрешён, персонаж может
    сдержаться, сорваться, уйти от ответа, передумать — как повёл бы себя именно
    он. НЕ копируй фразы из фрагментов и НЕ пересказывай их события — ситуация
    полностью новая. Избегай дежурной ролевой пластики: встретиться взглядом,
    уголки губ, тяжело вздохнул, воздух сгустился, по спине пробежал холодок —
    жесты и мизансцены каждый раз придумывай заново. Речевые привычки различай:
    лексика и ритм [[char]] не должны совпадать с другими персонажами. Отвечай
    только валидным JSON.

  user: |-
    Фрагменты, показывающие, как мыслит [[char]]:
    [[anchors]]

    Новая ситуация: [[situation]].

    Напиши ролевую сессию из [[turns_min]]-[[turns_max]] ходов, начиная с хода
    собеседника. Ходы собеседника, role "user", короткие: 1-3 предложения,
    реплика и/или действие. Ходы [[char]], role "char", — 2-6 предложений:
    наррация третьим лицом плюс прямая речь. Собеседника придумай сам, без имени
    или с новым именем.

    JSON: {"turns": [{"role": "user"|"char", "text": "..."}]}

  situations:
    - собеседник задаёт персонажу неудобный вопрос о его прошлом
    - собеседник возражает персонажу и спорит с его убеждениями
    - собеседник пытается уйти, персонаж хочет продолжить разговор
    - внезапная смена обстановки прерывает разговор
    - собеседник бурно реагирует эмоционально, персонаж должен ответить
    - собеседник просит персонажа о помощи в трудном деле
    - собеседник обвиняет персонажа в проступке
    - собеседник делится секретом и ждёт реакции
    - бытовая мелочь перерастает в разговор о важном
    - собеседник провоцирует персонажа на откровенность
    - персонажу нужно принять быстрое решение с моральной ценой
    - собеседник просит совета в ситуации, где нет хорошего выбора
    - персонаж обнаруживает, что собеседник что-то от него скрывал
    - старое обязательство всплывает в самый неподходящий момент

  behavior_mods:
    - ""
    - ""
    - В этой сцене персонаж ВЫЖИДАЕТ и наблюдает, не форсируя развязку.
    - Посреди разговора персонаж МЕНЯЕТ ТАКТИКУ, осознав, что первый подход не работает.
    - "Персонаж отвечает КОРОТКО и закрыто: 1-2 предложения на ход, мысль сжата до вспышки."
    - Персонаж УХОДИТ от прямого ответа, переводя разговор, но его мысль это выдаёт.
    - "Разговор ОБРЫВАЕТСЯ раньше развязки: сцена заканчивается на неразрешённом."
    - Персонаж ошибается в оценке собеседника и по ходу сцены это понимает.

augment:
  system: |-
    Ты переоформляешь готовый ролевой транскрипт под заданный список требований
    к формату.

    СТИЛЬ берёшь из ЭТАЛОНА — отрывка первоисточника: лексику, образность, ритм,
    тон, резкость. Это главное: голос должен остаться авторским.
    СОДЕРЖАНИЕ берёшь из ТРАНСКРИПТА: те же события, тот же порядок, те же по
    смыслу реплики, те же решения, намерения и решимость.
    МЕНЯЕШЬ только оформление, по списку требований.

    Запрещено: смягчать, сглаживать, цензурировать; делать персонажей вежливее
    или нерешительнее; менять исход сцены; добавлять или убирать события;
    заменять конкретные слова обтекаемыми; писать предисловия и комментарии.

    Отвечай строго валидным JSON.

  user: |-
    ЭТАЛОН СТИЛЯ — отрывок первоисточника, из которого собран транскрипт:
    ---
    [[scene]]
    ---

    ТРАНСКРИПТ — его и переоформляем:
    ---
    [[transcript]]
    ---

    ТРЕБОВАНИЯ К ФОРМАТУ:
    [[directives]]

    Переоформи ходы роли char по требованиям. Ходы роли user оставь дословно, их
    не трогай. Число и порядок ходов сохрани в точности.

    JSON: {"turns": [{"role": "char"|"user", "text": "..."}]}

translate:
  system: >-
    Ты переводишь ролевые сессии на русский. Переводи точно и живо, сохраняя
    форматирование — звёздочки действий, кавычки, абзацы — имена собственные
    (транслитерируй) и регистр каждой реплики. Ничего не добавляй, не сокращай и
    не смягчай. Верни ТОЛЬКО перевод, без комментариев.

openers:
  - "*[[user]] оказывается рядом с [[char]].*"
  - "*Сцена начинается. [[char]] уже здесь.*"
  - "*[[user]] ищет разговора с [[char]].*"
  - "*Новая сцена; [[char]] и [[user]] лицом к лицу.*"
  - "*Продолжение истории. [[char]] поднимает взгляд.*"
  - "*[[user]] застаёт [[char]] врасплох.*"
  - "*Где-то неподалёку — [[char]]. [[user]] подходит ближе.*"
  - "*Тишина. Потом [[char]] замечает [[user]].*"

diluent_openers:
  - "*Сцена продолжается.*"
  - "*Начало новой сцены.*"
  - "*Разговор завязывается.*"

# Русская типографика: ёлочки и тире-диалог существуют, а вот "plain" —
# диалог совсем без маркеров — в русской прозе практически не встречается,
# поэтому здесь такого значения нет.
axes:
  quotes:
    guillemets: "Прямая речь — в кавычках-ёлочках: «реплика»."
    dash: "Прямая речь — с новой строки через тире: — реплика."
    double: 'Прямая речь — в прямых кавычках: "реплика".'

  emphasis:
    asterisks: "Действия и выделенные фрагменты — в звёздочках: *так*."
    underscore: "Действия и выделенные фрагменты — в подчёркиваниях: _так_."
    plain: Без звёздочек и подчёркиваний — сплошной прозой.

  person:
    third: Повествование — в третьем лице.
    second: Повествование — во втором лице, обращаясь к собеседнику на «ты».
    first: Повествование — от первого лица персонажа.

  tense:
    past: Время повествования — прошедшее.
    present: Время повествования — настоящее.

  length:
    short: Объём каждого хода — менее 150 слов.
    medium: Объём каждого хода — 150-300 слов.
    long: Объём каждого хода — более 300 слов.

  paragraphs:
    dense: Пиши слитными плотными абзацами.
    airy: Дроби текст на короткие абзацы по 1-2 предложения.

  thoughts:
    none: Внутренние мысли отдельным блоком не выноси.
    inline: Внутренние мысли вплетай в наррацию по ходу сцены.
    appended: >-
      В конце хода добавь короткий блок мыслей персонажа, 1-3 обрывочные
      строки, после строки «---».

  name_prefix:
    clean: Не начинай ход с имени персонажа.
    prefixed: Начинай ход с имени говорящего и двоеточия.
